<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{% block title %}{% endblock %} — Резюмирую.рф</title>
<meta name="description" content="{% block meta_desc %}{% endblock %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2">
<link rel="icon" type="image/x-icon" href="/static/favicon.ico?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=2">
<link rel="manifest" href="/static/site.webmanifest">
<link rel="stylesheet" href="/static/app.css?v=20260830">
<script>(function(){try{if(localStorage.getItem('theme')!=='dark')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
<style>
main{padding:40px 22px 56px}
.legal-wrap{max-width:720px;margin:0 auto}
.legal-wrap h1{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--text);margin-bottom:6px}
.legal-wrap .subtitle{font-size:13px;color:var(--text-3);margin-bottom:36px}
.legal-wrap h2{font-size:15px;font-weight:700;color:var(--text);margin:32px 0 12px;padding-top:16px;border-top:1px solid var(--border)}
.legal-wrap h2:first-of-type{border-top:none;margin-top:0;padding-top:0}
.legal-wrap p{font-size:13.5px;color:var(--text-2);margin-bottom:14px;line-height:1.75}
.legal-wrap ul,.legal-wrap ol{padding-left:1.4rem;margin-bottom:14px}
.legal-wrap li{font-size:13.5px;color:var(--text-2);margin-bottom:6px;line-height:1.65}
.legal-wrap strong{color:var(--text);font-weight:700}
.legal-wrap a{color:var(--accent);text-decoration:none}
.legal-wrap a:hover{text-decoration:underline}
.legal-wrap .requisites{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 24px;margin-top:28px}
.legal-wrap .requisites p{margin-bottom:6px}
</style>
{% include '_metrika.html' %}
</head>
<body>

<header class="appbar">
  <a class="appbar__logo" href="/" aria-label="Резюмирую.рф">
    <span class="logo-mark">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10l4 4v12H5z"></path><path d="M9 11h6M9 15h4"></path></svg>
    </span>
    <span class="brand">Резюмирую</span>
  </a>
  <div class="appbar__right">
    <button id="theme-btn" class="theme-btn" type="button" aria-label="Сменить тему">🌙</button>
  </div>
</header>

<main>
  <div class="legal-wrap">
    <h1>{% block page_title %}{% endblock %}</h1>
    <p class="subtitle">{% block page_subtitle %}{% endblock %}</p>
    {% block content %}{% endblock %}
  </div>
</main>

{% include '_app_footer.html' %}

<script>
(function () {
  const btn = document.getElementById('theme-btn');
  const sync = () => {
    const light = document.documentElement.getAttribute('data-theme') === 'light';
    btn.textContent = light ? '☀️' : '🌙';
  };
  btn.addEventListener('click', () => {
    const light = document.documentElement.getAttribute('data-theme') === 'light';
    if (light) document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', 'light');
    try { localStorage.setItem('theme', light ? 'dark' : 'light'); } catch (e) {}
    sync();
  });
  sync();
})();
</script>
</body>
</html>
