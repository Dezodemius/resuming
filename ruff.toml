# Конфигурация линтера.
#
# Без этого файла набор правил — это «то, что ruff считает умолчанием в той
# версии, которая оказалась установлена». Версия в requirements-dev.txt
# закреплена, а локально у разработчика стоит своя: на ruff 0.16 тот же код
# давал 80 замечаний, на закреплённой 0.8 — ноль. Гейт, который зависит от
# версии линтера, а не от кода, не гейт: он либо молчит в CI и шумит локально,
# либо краснеет на ровном месте после безобидного обновления зависимости.
#
# Поэтому набор правил задан явно. Он совпадает с тем, что фактически
# проверялось до сих пор (умолчание ruff 0.8: E4/E7/E9 + F), — то есть этот
# файл ничего не ужесточает, а лишь фиксирует уже действующее состояние и
# делает его воспроизводимым на любой версии.
#
# Расширять набор нужно по одному правилу за раз, отдельным коммитом: список
# кандидатов, которые код почти проходит, — в docs/architecture-roadmap.md.

target-version = "py312"
line-length = 120

exclude = [
    "mutants",     # копия проекта, которую делает mutmut
    "redesign",    # выгрузка макетов, не наш код
]

[lint]
select = ["E4", "E7", "E9", "F"]
