# Конфигурация мутационного тестирования (mutmut 3.x).
#
# Обычный `mutmut run` мутирует все source_paths целиком — это десятки минут
# на main.py. В CI и локально запускать надо инкрементальный обёртчик:
#     python tools/mutation_diff.py --base origin/main
# Он отбирает мутантов по git-диффу и роняет сборку на любом выжившем.

[mutmut]
# Мутируем только код приложения. tests/, tools/, deploy/ и ops_mcp/
# (отдельный сервис со своими зависимостями и без тестов) — не мутируем.
source_paths =
    main.py
    config.py
    db.py
    prompts.py
    schemas.py

# mutmut прогоняет тесты в копии проекта (каталог mutants/) и по умолчанию
# переносит туда только tests/ и сам setup.cfg. Без pytest.ini там нет
# asyncio_mode=auto и весь async-набор падает ещё на «clean tests»;
# templates/ и static/ нужны приложению на импорте (StaticFiles) и рендере.
# tools/ нужен для tests/test_mutation_gate.py: он проверяет сам отсев мутантов
# (tools/mutation_ignore.py) и импортирует его по пути относительно репозитория.
also_copy =
    pytest.ini
    templates/
    static/
    tools/

# Сценарии behave запускаются отдельным шагом пайплайна — мутантов гоняем
# по обычному набору тестов.
pytest_add_cli_args_test_selection =
    tests/

# test_mcp_endpoint_without_auth_is_not_5xx поднимает MCP session manager
# вручную, а mutmut прогоняет pytest несколько раз в одном процессе — на втором
# запуске падает «StreamableHTTPSessionManager.run() can only be called once».
# Отключаем только этот тест, остальной набор mutmut гоняет целиком.
pytest_add_cli_args =
    --deselect=tests/test_mcp.py::test_mcp_endpoint_without_auth_is_not_5xx
