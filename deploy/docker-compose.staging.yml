# Compose стенда (timeweb.cloud, Linux VPS без GPU).
#
# Отличия от продового docker-compose.yml:
#   • нет сервиса ollama — стенд ходит на внешний OLLAMA_URL из .env;
#   • нет ops-mcp — он монтирует docker.sock (= root на хосте), стенду не нужен;
#   • nginx слушает default_server (стенд открывается по IP, без домена).
#
# Пути внутри файла относительны каталога deploy/ — compose берёт за рабочий
# каталог директорию compose-файла. Запуск: см. deploy/deploy.sh.
name: resuming-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ── FastAPI приложение ────────────────────────────────────────────────
  app:
    build:
      context: ..
    container_name: resuming-staging-app
    restart: unless-stopped
    logging: *default-logging
    # .env стенда лежит рядом с кодом; deploy.sh кладёт его из $DEPLOY_PATH/.env
    env_file: ../.env
    volumes:
      - app_data:/app/data        # SQLite база стенда, переживает передеплой
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Nginx (реверс-прокси, порт наружу) ───────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: resuming-staging-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${STAGING_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
      # Каталог с опциональным basic-auth: deploy.sh кладёт туда auth.conf +
      # .htpasswd, если заданы STAGING_AUTH_USER/STAGING_AUTH_PASSWORD.
      # Пустой каталог — включается include с нулём совпадений, это не ошибка.
      - ./_authconf:/etc/nginx/staging-auth:ro
    depends_on:
      - app

volumes:
  app_data:
