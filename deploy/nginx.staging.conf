# Nginx стенда: сайт открывается по IP сервера, домена и TLS нет.
server {
    listen 80 default_server;
    server_name _;

    # Долгий таймаут для AI-генераций (до 2 минут) — как в проде
    proxy_read_timeout    120s;
    proxy_connect_timeout 10s;
    client_max_body_size  10M;

    # Стенд не должен попадать в поиск
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Опциональный basic-auth: файл появляется здесь только если заданы
    # STAGING_AUTH_USER/STAGING_AUTH_PASSWORD (см. deploy/README.md).
    include /etc/nginx/staging-auth/*.conf;

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Проверки живости — всегда без пароля, иначе деплой-скрипт и мониторинг
    # получают 401 вместо статуса приложения
    location ~ ^/(healthz|readyz)$ {
        auth_basic off;
        proxy_pass         http://app:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   CF-Connecting-IP  $remote_addr;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://app:8000;
        proxy_set_header   Host              $host;
        # Перед стендом нет Cloudflare, а приложение берёт ключ rate-limit из
        # CF-Connecting-IP. Не затерев заголовок, любой клиент подделал бы его
        # и обошёл лимиты — поэтому подставляем реальный адрес соединения.
        proxy_set_header   CF-Connecting-IP  $remote_addr;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # MCP (streamable-http): потоковые/долгие ответы — не буферизуем
    location /mcp {
        proxy_pass         http://app:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   CF-Connecting-IP  $remote_addr;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_http_version 1.1;
    }
}
