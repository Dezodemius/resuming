# Общая политика логов: ограничиваем размер, чтобы docker json-log не забил диск.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ── Ollama (локальная AI-модель) ──────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: resuming-ollama
    restart: unless-stopped
    logging: *default-logging
    # Лимит памяти: загрузка слишком большой модели упадёт внутри контейнера,
    # а не задушит всю VM (иначе nginx/app перестают отвечать и сайт отдаёт 522)
    mem_limit: 6g
    environment:
      - OLLAMA_KEEP_ALIVE=24h   # держим модель в памяти, а не перегружаем на каждый запрос
    # Порт наружу не публикуем: app ходит к Ollama по внутреннему DNS compose
    # (OLLAMA_URL=http://ollama:11434). Публикация 11434:11434 пробивала бы
    # iptables хоста и открывала бы инференс без аутентификации всему интернету
    # (issue #37) — expose оставляет доступ только внутри сети compose.
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    # NVIDIA GPU (если на машине нет GPU — закомментируй блок deploy ниже):
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── FastAPI приложение ────────────────────────────────────────────────
  app:
    build: .
    container_name: resuming-app
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434   # ollama доступен по имени сервиса
    volumes:
      - app_data:/app/data              # SQLite база
    depends_on:
      - ollama
    # Проверяем сам процесс, а не Ollama: /readyz ушёл бы в unhealthy при любой
    # заминке модели, хотя сайт при этом продолжает работать.
    # curl в python:slim нет — ходим встроенным urllib.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Nginx (реверс-прокси, порт 80 наружу) ────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: resuming-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  ollama_data:   # модели хранятся между перезапусками
  app_data:      # база данных
