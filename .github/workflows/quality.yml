name: Quality gates

# Три последовательных этапа: линтер → Gherkin-сценарии → мутационное
# тестирование. Каждый следующий стартует только на зелёном предыдущем (needs),
# чтобы не жечь минуты раннера на мутантах при упавшем линтере.
#
# Деплой (ci_cd.yml) намеренно не зависит от этого воркфлоу: пока мутационный
# балл на существующем коде не подтянут, жёсткий гейт блокировал бы выкатку.
# Когда будете готовы — включите quality.yml в required status checks ветки.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  SECRET_KEY: ci-test-secret-key-not-for-production

jobs:
  lint:
    name: "1. Линтер и статический анализ"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff check
        run: ruff check --output-format=github .

      - name: Синтаксис всех модулей проекта
        run: python -m compileall -q main.py config.py db.py prompts.py schemas.py tools tests

  bdd:
    name: "2. Gherkin-сценарии (behave)"
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Все шаги сценариев реализованы
        run: behave --dry-run

      - name: Прогон сценариев
        run: behave --junit --junit-directory reports/bdd

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdd-report
          path: reports/bdd

  mutation:
    name: "3. Мутационное тестирование (mutmut)"
    needs: bdd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Инкрементальный режим считает дифф с базовой веткой — нужна история.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements.txt -r requirements-dev.txt

      # База диффа считается отдельным шагом, а не выражением в env: раньше для
      # push она была `HEAD^`, то есть гейт проверял ровно один последний
      # коммит. Пуш из нескольких коммитов проверялся частично, а зелёная
      # галочка на ветке выглядела так, будто покрыт весь набор изменений.
      #
      # Правильная база зависит от события:
      #   • PR                    — целевая ветка (что PR добавляет к ней);
      #   • push в main           — состояние main до пуша (что пуш принёс);
      #   • push в ветку (develop)— origin/main (что ветка добавляет к main).
      # Сам скрипт берёт merge-base с этой базой, поэтому чужие коммиты,
      # приехавшие в main после ответвления, в дифф не попадают.
      - name: База для диффа мутаций
        id: mutbase
        env:
          # Через env, а не подстановкой ${{ }} в тело скрипта: репозиторий
          # публичный, а имена ссылок в shell-код подставлять нельзя.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ "$REF_NAME" = "main" ]; then
            base="$BEFORE_SHA"
          else
            base="origin/main"
          fi
          # before приходит нулями при создании ветки, а после force-push
          # объекта может уже не быть: и там, и там откатываемся на HEAD^,
          # чтобы гейт не падал на разрешении ссылки.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "База '${base}' не разрешается — откатываюсь на HEAD^"
            base="HEAD^"
          fi
          echo "Событие=$EVENT_NAME ref=$REF_NAME → база=$base"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      # Мутируются только функции, задетые диффом. Сборка падает на любом
      # невыжившем мутанте (--allow-survived 0 — значение по умолчанию).
      - name: Мутанты по git-диффу
        run: python tools/mutation_diff.py --base "${{ steps.mutbase.outputs.base }}"
