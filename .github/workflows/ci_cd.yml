name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production

  # Дев-стенд на той же машине: отдельный каталог, отдельная база, порт
  # 127.0.0.1:8002 без домена. Ронять прод он не может — общего у контуров
  # только сервер, — поэтому и требования к джобе мягче: не настроен доступ,
  # значит пропускаем с предупреждением, а не красим пуш в develop в красное.
  deploy-dev:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Настроен ли доступ к стенду
        id: gate
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          KEY: ${{ secrets.SSH_DEV_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing SSH_HOST"
          [ -n "$USER" ] || missing="$missing SSH_USER"
          [ -n "$KEY" ] || missing="$missing SSH_DEV_KEY"
          [ -n "$KNOWN_HOSTS" ] || missing="$missing SSH_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::warning::Дев-стенд не настроен (нет секретов:$missing) — выкат пропущен. Как поднять: deploy/README.md, раздел «Дев-стенд»."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Ключ отдельный от боевого и с собственным forced-command: он умеет
      # только поднять стенд из origin/develop. Одним ключом на два контура
      # обойтись нельзя — forced-command привязан к ключу, а не к команде.
      - name: Ключ доступа к стенду
        if: steps.gate.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_DEV_KEY }}" > ~/.ssh/id_deploy_dev
          chmod 600 ~/.ssh/id_deploy_dev
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Проверка снаружи, как у прода, здесь невозможна и не нужна: стенд
      # слушает 127.0.0.1. За него отвечает сам deploy-dev.sh — он ждёт
      # healthcheck и дёргает /healthz и /dev изнутри машины, так что упавший
      # выкат приезжает сюда ненулевым кодом ssh.
      - name: Выкатить стенд
        if: steps.gate.outputs.ready == 'true'
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -i ~/.ssh/id_deploy_dev -p "${SSH_PORT:-22}" -o BatchMode=yes -o ConnectTimeout=20 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"

      - name: Как зайти
        if: steps.gate.outputs.ready == 'true'
        run: |
          echo "Стенд обновлён. С ноутбука:"
          echo "  ./deploy/dev-tunnel.ps1        # или ssh -N -L 8002:127.0.0.1:8002 app01"
          echo "  http://localhost:8002/dev"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # Без этой проверки отсутствующий секрет разворачивался в пустую строку,
      # ssh получал destination "@" и вываливал свою справку по использованию —
      # по такому логу невозможно понять, что дело всего лишь в ненастроенных
      # секретах. Падаем раньше и по делу.
      - name: Проверить, что доступы настроены
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing SSH_HOST"
          [ -n "$USER" ] || missing="$missing SSH_USER"
          [ -n "$KEY" ] || missing="$missing SSH_KEY"
          [ -n "$KNOWN_HOSTS" ] || missing="$missing SSH_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "Не заданы секреты репозитория:$missing"
            echo
            echo "Выкат на app-01 без них невозможен. Как настроить —"
            echo "deploy/README.md, раздел «Прод: разовая настройка»."
            echo "Прод при этом продолжает работать на прежней версии,"
            echo "выкатить можно вручную командой из того же раздела."
            exit 1
          fi
          echo "Секреты на месте. Учтите: непустой SSH_KEY ещё не значит,"
          echo "что это нужный ключ — если следующий шаг ответит"
          echo "Permission denied (publickey), замените SSH_KEY."

      # Ключ ограничен на стороне сервера forced-command в authorized_keys:
      # он умеет только запустить выкат и не даёт шелл. Настройка — deploy/README.md.
      - name: Ключ доступа к app-01
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Обёртка на сервере сама подтягивает origin/main и запускает
      # deploy/deploy-prod.sh из свежего дерева. Команду отсюда не передаём —
      # forced-command её всё равно игнорирует.
      - name: Выкатить на app-01
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" -o BatchMode=yes -o ConnectTimeout=20 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"

      # Через Cloudflare — то, что реально видит пользователь. Healthcheck
      # внутри машины этого не покрывает: хостовой nginx общий с двумя другими
      # проектами и может отвалиться отдельно от контейнеров.
      - name: Проверить снаружи
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://xn--e1aedprev8fe.xn--p1ai/healthz || echo 000)
            if [ "$code" = "200" ]; then echo "healthz снаружи: 200"; exit 0; fi
            echo "попытка $i: $code"; sleep 10
          done
          echo "ОШИБКА: сайт снаружи не отвечает 200"
          exit 1
