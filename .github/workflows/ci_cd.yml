name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # Ключ ограничен на стороне сервера forced-command в authorized_keys:
      # он умеет только запустить выкат и не даёт шелл. Настройка — deploy/README.md.
      - name: Ключ доступа к app-01
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.APP01_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.APP01_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Обёртка на сервере сама подтягивает origin/main и запускает
      # deploy/deploy-prod.sh из свежего дерева. Команду отсюда не передаём —
      # forced-command её всё равно игнорирует.
      - name: Выкатить на app-01
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 "${{ secrets.APP01_USER }}@${{ secrets.APP01_HOST }}"

      # Через Cloudflare — то, что реально видит пользователь. Healthcheck
      # внутри машины этого не покрывает: хостовой nginx общий с двумя другими
      # проектами и может отвалиться отдельно от контейнеров.
      - name: Проверить снаружи
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://xn--e1aedprev8fe.xn--p1ai/healthz || echo 000)
            if [ "$code" = "200" ]; then echo "healthz снаружи: 200"; exit 0; fi
            echo "попытка $i: $code"; sleep 10
          done
          echo "ОШИБКА: сайт снаружи не отвечает 200"
          exit 1
