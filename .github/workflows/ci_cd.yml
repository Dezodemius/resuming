name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # Без этой проверки отсутствующий секрет разворачивался в пустую строку,
      # ssh получал destination "@" и вываливал свою справку по использованию —
      # по такому логу невозможно понять, что дело всего лишь в ненастроенных
      # секретах. Падаем раньше и по делу.
      - name: Проверить, что доступы настроены
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing SSH_HOST"
          [ -n "$USER" ] || missing="$missing SSH_USER"
          [ -n "$KEY" ] || missing="$missing SSH_KEY"
          [ -n "$KNOWN_HOSTS" ] || missing="$missing SSH_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "Не заданы секреты репозитория:$missing"
            echo
            echo "Выкат на app-01 без них невозможен. Как настроить —"
            echo "deploy/README.md, раздел «Прод: разовая настройка»."
            echo "Прод при этом продолжает работать на прежней версии,"
            echo "выкатить можно вручную командой из того же раздела."
            exit 1
          fi
          echo "Секреты на месте. Учтите: непустой SSH_KEY ещё не значит,"
          echo "что это нужный ключ — если следующий шаг ответит"
          echo "Permission denied (publickey), замените SSH_KEY."

      # Ключ ограничен на стороне сервера forced-command в authorized_keys:
      # он умеет только запустить выкат и не даёт шелл. Настройка — deploy/README.md.
      - name: Ключ доступа к app-01
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Обёртка на сервере сама подтягивает origin/main и запускает
      # deploy/deploy-prod.sh из свежего дерева. Команду отсюда не передаём —
      # forced-command её всё равно игнорирует.
      - name: Выкатить на app-01
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" -o BatchMode=yes -o ConnectTimeout=20 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"

      # Через Cloudflare — то, что реально видит пользователь. Healthcheck
      # внутри машины этого не покрывает: хостовой nginx общий с двумя другими
      # проектами и может отвалиться отдельно от контейнеров.
      - name: Проверить снаружи
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://xn--e1aedprev8fe.xn--p1ai/healthz || echo 000)
            if [ "$code" = "200" ]; then echo "healthz снаружи: 200"; exit 0; fi
            echo "попытка $i: $code"; sleep 10
          done
          echo "ОШИБКА: сайт снаружи не отвечает 200"
          exit 1
